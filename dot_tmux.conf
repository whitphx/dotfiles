# prefixキーをC-oに変更する
set -g prefix C-o

# C-bのキーバインドを解除する
unbind C-b

# Prefix + cで新しいウィンドウを作成する & 既存のウィンドウの後ろに追加する
bind-key c new-window -a

# キーストロークのディレイを減らす
set -sg escape-time 0

set -g focus-events on

# ウィンドウのインデックスを1から始める
set -g base-index 1

set-option -g renumber-windows on   # ウィンドウを閉じた時に番号を詰める

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-o*2でtmux内のプログラムにC-oを送る
bind C-o send-prefix

# Split pane horizontally, preserving the current path
bind 3 split-window -h -c "#{pane_current_path}"

# Split pane vertically, preserving the current path
bind 2 split-window -v -c "#{pane_current_path}"

# Move a window
# ref: https://superuser.com/a/552493
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# マウス操作を有効にする
setw -g mouse on

# Enable 256 colors
set -g default-terminal "tmux-256color"
# (Optional) Enable true color (RGB) support
# This tells tmux that your outside terminal (like Alacritty, iTerm2, or Kitty) supports RGB
set -as terminal-features ",*:RGB"

set -g allow-passthrough on

# Suppress flicker/tearing (synchronized output)
set -as terminal-features ",tmux-256color:sync"


# ステータスバーの色を設定する
setw -g status-style fg=colour255,bg=colour234

# ウィンドウリストの色を設定する
setw -g window-status-style fg=cyan,bg=default,dim
# アクティブなウィンドウを目立たせる
setw -g window-status-current-style fg=white,bright,bg=colour170

# ペインボーダーの色を設定する
set -g pane-border-style fg=colour111,bg=colour236
# アクティブなペインを目立たせる
set -g pane-active-border-style fg=colour227,bg=colour240

# コマンドラインの色を設定する
set -g message-style fg=white,bg=black,bright

# Plugins
## Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
## Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
## Plugins for saving and restoring sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Status bar settings
## 左パネルを設定する
set -g status-left-length 40
set -g status-left "#[fg=yellow]W-#I #[fg=cyan]P-#P"
## 右パネルを設定する
set -g @online_icon "🛜"
set -g @offline_icon "💔"
set -g status-right '#{prefix_highlight}#[fg=colour59, bg=colour234]#[fg=brightwhite, bg=colour59] #{battery_icon} #{battery_percentage} #{online_status}#[fg=colour234, bg=colour59] #[fg=colour59, bg=colour234]#[fg=brightwhite, bg=colour59] %Y-%m-%d(%a) %H:%M '
## リフレッシュの間隔を設定する(デフォルト 15秒)
set -g status-interval 10
## ウィンドウリストの位置を中心寄せにする
set -g status-justify centre
## Enable activity monitoring without visual notifications
setw -g monitor-activity on
set -g visual-activity off
## ステータスバーを上部に表示する
set -g status-position top

# Configure copy mode
bind-key -T copy-mode C-w send-keys -X copy-pipe-and-cancel "pbcopy" \; display "Copied"  # tmux 2.6 and above does not require reattach-to-user-namespace
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy" \; display "Copied"
bind C-y run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# Use fish
set -g default-shell /opt/homebrew/bin/fish

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
